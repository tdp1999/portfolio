<dialog
  #dialog
  class="confirm"
  aria-labelledby="checklist-confirm-heading"
  (cancel)="onCancel($event)"
  (click)="onClick($event)"
  (keydown.escape)="$event.stopPropagation()"
>
  <div class="confirm__card">
    <h2 id="checklist-confirm-heading" class="confirm__heading">{{ heading() }}</h2>
    @if (message()) {
      <p class="confirm__message">{{ message() }}</p>
    }
    <div class="confirm__actions">
      <landing-button variant="ghost" size="sm" (buttonClick)="cancelled.emit()">Cancel</landing-button>
      <landing-button variant="solid" size="sm" (buttonClick)="confirmed.emit()">{{ confirmLabel() }}</landing-button>
    </div>
  </div>
</dialog>
