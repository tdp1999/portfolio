<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thunderphong's Console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSP Notes:
      - 'unsafe-inline' in script-src required for Angular inline scripts and CF analytics
      - 'unsafe-inline' in style-src required by Tailwind and boot spinner
      - frame-ancestors is set via helmet on the API (meta tags don't support it)
      - http://localhost:3000 in img-src: when Cloudinary is unconfigured the API stores media
        on disk and serves it from its own origin, so uploaded images render off :3000 rather
        than an https CDN. Mirrors the connect-src entry below. Production media is https.
        See LocalStorageService.

    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com;
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        connect-src 'self' http://localhost:3000 https://dashboard-api.thunderphong.com https://accounts.google.com https://cloudflareinsights.com;
        img-src 'self' data: blob: https: http://localhost:3000;
        font-src 'self' https://fonts.gstatic.com;
        frame-src https://accounts.google.com;
        object-src 'none';
        base-uri 'self';
      "
    />
    <!--
      Brand favicon — generated by .claude/skills/brand-identity (target: console-favicons).
      The Monogram runs transparent here, so the tab strip shows through and its colour
      changes with the user's theme. favicon.svg carries both inks behind a
      prefers-color-scheme query and wins wherever SVG icons are supported; the .ico is the
      accent-monotone fallback, the only fixed ink that reads on a light AND a dark strip.
      Order matters: the .ico goes first so SVG-capable browsers override it.
    -->
    <link rel="icon" type="image/x-icon" href="/brand/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <console-root>
      <!-- Shown until Angular bootstraps; replaced automatically -->
      <style>
        .boot-spinner {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
        }
        .boot-spinner div {
          width: 40px;
          height: 40px;
          border: 3px solid #e5e7eb;
          border-top-color: #3b82f6;
          border-radius: 50%;
          animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="boot-spinner"><div></div></div>
    </console-root>
  </body>
</html>
