<landing-page-shell [breadcrumb]="breadcrumb()" align="center">
  <span hero-heading><em>Uses</em>.</span>
  <p hero-lede>{{ 'uses.lede' | landingCopy: locale() }}</p>
  <p meta-strip>
    {{ 'common.lastUpdated' | landingCopy: locale() }}
    <time [attr.datetime]="lastUpdated">{{ lastUpdatedLabel() }}</time
    >.
  </p>

  <section aria-labelledby="uses-inventory-h">
    <landing-container>
      <h2 id="uses-inventory-h" class="sr-only">{{ 'uses.a11y.inventory' | landingCopy: locale() }}</h2>
      @for (section of sections(); track section.id) {
        <landing-content-section [section]="section" class="mb-12" />
      }
    </landing-container>
  </section>
</landing-page-shell>
