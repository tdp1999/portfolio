<landing-page-shell [breadcrumb]="breadcrumb()" align="center">
  <span hero-heading>{{ title() }}</span>

  <section class="sign-in-page" [attr.aria-label]="title()">
    <landing-container size="wide">
      @if (auth.status() === 'signed-out') {
        <landing-sign-in-form
          [withHeading]="false"
          [submitting]="auth.isSubmitting()"
          [error]="auth.signInError()"
          (submitted)="auth.signIn($event)"
        />
      } @else {
        <div class="sign-in-page__waiting">
          <landing-loading-spinner [message]="checkingLabel()" />
        </div>
      }
    </landing-container>
  </section>
</landing-page-shell>
