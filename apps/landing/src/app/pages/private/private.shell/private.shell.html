<!-- No page-wide container: each private page sets its own frame (the checklist run page needs the
     full width for its reference rail). The workspace bar keeps the usual wide container. -->
@if (signedIn()) {
  <div class="private-shell">
    <landing-container size="wide">
      <landing-workspace-bar (signOut)="signOut()" />
    </landing-container>
    <div class="private-shell__page">
      <router-outlet />
    </div>
  </div>
} @else {
  <div class="private-shell private-shell--waiting">
    <landing-loading-spinner [message]="checkingLabel()" />
  </div>
}
